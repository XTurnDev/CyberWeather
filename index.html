<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Sky – Weather</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--panel:#f3f2ec;--ink:#1b1b19;--mute:#6b695f;--line:#1b1b19;--soft:#d9d5c3;--icon:#1b1b19;--tb:78px;box-sizing:border-box;color-scheme:light}
:root[data-theme="dark"]{--bg:#17171a;--panel:#212125;--ink:#ecebe4;--mute:#a4a296;--line:#ecebe4;--soft:#44433d;--icon:#e6d8b8;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(var(--soft) 1px,transparent 1.5px) 0 0/24px 24px var(--bg);animation:drift 6s linear infinite;color:var(--ink);font:400 16px/1.6 "Zen Kaku Gothic New",system-ui,sans-serif;overflow:hidden}
@keyframes drift{to{background-position:-24px 24px}}
h2{font-size:26px;margin:0 0 8px}
p{margin:0 0 12px}
[hidden]{display:none!important}
.mute{color:var(--mute);font-size:14px}
button{font:inherit;color:inherit}
.btn{position:relative;--cut:14px;display:inline-block;font:500 15px/1 "Zen Kaku Gothic New",sans-serif;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);padding:12px 22px;cursor:pointer;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%);transition:background .12s,color .12s}
.btn::after{content:"";position:absolute;right:-1.5px;bottom:-1.5px;width:var(--cut);height:var(--cut);pointer-events:none;background:linear-gradient(to top left,transparent 50%,var(--line) 50%,var(--line) calc(50% + 1.6px),transparent calc(50% + 1.6px))}
.btn:focus-visible{outline:none;background:var(--ink);color:var(--bg)}
@media (hover:hover){.btn:hover{background:var(--ink);color:var(--bg)}}
.mode{--cut:8px;position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:8;width:40px;height:40px;padding:0;display:grid;place-items:center;color:var(--icon)}
.mode svg{display:block;width:32px;height:32px}
.search{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(320px,calc(100% - 200px));z-index:7}
#q{width:100%;font:400 16px "Roboto Mono",monospace;height:40px;padding:0 12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:0}
#q::placeholder{color:var(--mute)}
.rs{position:absolute;top:100%;left:0;right:0;margin-top:-1.5px;border:1.5px solid var(--line);background:var(--bg);max-height:240px;overflow:auto}
.rs button,.rs .nr{display:block;width:100%;text-align:left;background:var(--bg);border:0;border-bottom:1px solid var(--soft);padding:9px 12px;cursor:pointer;font-size:15px}
.rs .nr{cursor:default;color:var(--mute);font-size:13px}
.rs button:hover,.rs button:focus-visible{background:var(--panel)}
#pager{position:fixed;top:0;left:0;right:0;bottom:calc(var(--tb) + env(safe-area-inset-bottom,0px));display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#pager::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:calc(72px + env(safe-area-inset-top,0px)) 24px 24px}
.in{max-width:720px;margin:0 auto}
#p1 .in{text-align:center}
.scr{min-height:calc(100vh - var(--tb) - 120px);min-height:calc(100dvh - var(--tb) - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{image-rendering:pixelated}
.ic{color:var(--icon)}
.ic svg{display:block;width:100%;height:100%}
.gauge{position:relative;display:block;width:min(86vw,340px);margin:6px auto 10px;padding:0;background:none;border:0;color:var(--ink)}
.gauge svg.arc{display:block;width:100%;height:auto}
.gauge .disc{fill:var(--panel)}
.gauge .trk,.gauge .fil{fill:none;stroke-width:8}
.gauge .trk{stroke:var(--soft)}
.gauge .fil{stroke:var(--ink);transition:stroke-dasharray .3s}
.gauge .fil.hot{stroke:#d92b2b}
.gauge .fil.cold{stroke:#2b6fd9}
.gl{font:11px "Roboto Mono",monospace;fill:var(--mute)}
.gauge .ic{position:absolute;left:50%;bottom:18.5%;width:128px;height:128px;transform:translateX(-50%)}
.cond{font-size:clamp(28px,6vw,40px);font-weight:700;line-height:1.1;margin-bottom:16px}
.temp{font:500 clamp(40px,9vw,64px)/1.1 "Roboto Mono",monospace;margin:4px 0 0}
.temp.hot{color:#d92b2b}
.temp.cold{color:#2b6fd9}
.temp,.stats b,.rng,#rd,.cell b{font-variant-numeric:slashed-zero}
#where{font:400 13px "Roboto Mono",monospace}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;margin-bottom:18px}
.stats div,.cell{border:1.5px solid var(--line);padding:10px 8px;background:var(--bg)}
.stats b,.cell b{display:block;font:500 17px "Roboto Mono",monospace}
.stats span,.cell span{color:var(--mute);font-size:13px}
.wear{padding:28px 0 40px;border-top:1.5px solid var(--line)}
.fbox{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:18px;margin:16px auto;padding:20px;max-width:420px;border:1.5px solid var(--line);background:var(--panel)}
.wc{text-align:center;line-height:1.3}
.wc span{display:block;font:400 12px "Roboto Mono",monospace;color:var(--mute);margin-top:6px}
.wi{width:112px;height:112px;color:var(--icon)}
.wi.x{width:64px;height:64px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.ws{font-size:20px;font-weight:700;margin-bottom:6px}
.wd{max-width:46ch;margin:0 auto}
.mapbox{position:relative;border:1.5px solid var(--line);aspect-ratio:2/1;background:var(--bg);margin:14px 0;cursor:crosshair;touch-action:pan-x pan-y;overflow:hidden;user-select:none;-webkit-user-select:none}
.mapbox.zm{touch-action:none;cursor:grab}
.mz{position:absolute;inset:0;transform-origin:0 0;transform:translate(var(--tx,0px),var(--ty,0px)) scale(var(--z,1))}
.mz canvas{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border:1.5px solid var(--line);background:var(--ink);pointer-events:none;transform:scale(calc(1 / var(--z,1)))}
.zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zbtn{--cut:8px;width:36px;height:36px;padding:0;font-size:20px;line-height:1;display:grid;place-items:center}
.pin.q{background:var(--bg);box-shadow:0 0 0 3px var(--ink)}
.pin b{position:absolute;left:16px;top:-3px;font-size:12px;background:var(--bg);padding:0 4px;line-height:1.3;white-space:nowrap}
#rd{font:400 14px/1.6 "Roboto Mono",monospace;border:1.5px solid var(--line);background:var(--panel);padding:10px 14px}
.dw{margin-bottom:10px}
.day{display:grid;grid-template-columns:64px 1fr 120px;gap:14px;align-items:center;border:1.5px solid var(--line);padding:8px 14px 8px 8px;background:var(--bg);cursor:pointer}
.day.t,.day[aria-expanded="true"]{background:var(--panel)}
.day .ic{width:64px;height:64px}
.day b{display:block;line-height:1.3}
.day small{color:var(--mute);font-size:13px}
.rng{font:500 14px "Roboto Mono",monospace;text-align:right}
.bar{height:6px;background:var(--soft);margin-top:6px;position:relative}
.bar i{position:absolute;top:0;bottom:0;background:var(--ink)}
.det{border:1.5px solid var(--line);border-top:0;padding:14px;background:var(--bg)}
.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.det p{margin:0;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1.5px solid var(--line);padding:12px max(14px,calc(50% - 260px)) calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center}
.tabs .ln{flex:1;min-width:12px;height:1.5px;background:var(--line)}
.tabs .btn{--cut:10px;flex:none;padding:11px 14px;font-size:14px}
.tabs .btn[aria-current]{background:var(--ink);color:var(--bg)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (max-width:600px){
  .stats{grid-template-columns:1fr 1fr}.dg{grid-template-columns:1fr 1fr}
  .day{grid-template-columns:64px 1fr 92px}.pg{padding-left:16px;padding-right:16px}
  .gauge{width:70vw}.gauge .ic{width:96px;height:96px}
  .wi{width:96px;height:96px}.wi.x{width:48px;height:48px}
  .search{left:16px;transform:none;width:calc(100% - 84px)}
}
@media (prefers-reduced-motion:reduce){body{animation:none}}
</style>
</head>
<body>
<div class="search">
  <input id="q" type="search" placeholder="Search city" aria-label="Search city" autocomplete="off">
  <div class="rs" id="rs" hidden></div>
</div>
<button class="btn mode" id="mode" type="button" aria-pressed="false" aria-label="Switch to night mode"></button>

<div id="pager">
  <section class="pg" id="p0" aria-label="World wind map"><div class="in">
    <h2>World winds</h2>
    <p class="mute" id="wnote">An illustrated wind model, not live data. Tap the map to read the wind at that spot.</p>
    <div class="mapbox" id="mb">
      <div class="mz" id="mz">
        <canvas id="land" width="240" height="120"></canvas>
        <canvas id="wind" width="240" height="120"></canvas>
        <span class="pin" id="you" style="left:57.9%;top:29.3%"><b id="yl">Muğla</b></span>
        <span class="pin q" id="qp" hidden></span>
      </div>
      <div class="zb"><button class="btn zbtn" id="zin" type="button" aria-label="Zoom in">+</button><button class="btn zbtn" id="zout" type="button" aria-label="Zoom out">&minus;</button></div>
    </div>
    <div id="rd">Tap the map to see the wind.</div>
  </div></section>

  <section class="pg" id="p1" aria-label="Weather now"><div class="in">
    <div class="scr">
      <p class="mute" id="where"></p>
      <div class="temp" id="temp">--°C</div>
      <div class="gauge" id="fr" role="img" aria-label="Current weather">
        <svg class="arc" viewBox="0 -8 340 202" aria-hidden="true">
          <path class="disc" d="M25 165A145 145 0 0 1 315 165Z"/>
          <path class="trk" d="M20 165A150 150 0 0 1 320 165"/>
          <path class="fil" id="arcF" d="M20 165A150 150 0 0 1 320 165" pathLength="100" stroke-dasharray="0 100"/>
          <line x1="14" y1="165" x2="326" y2="165" stroke="currentColor" stroke-width="1.5"/>
          <g id="ticks"></g>
          <text class="gl" x="20" y="188" text-anchor="middle">-20</text>
          <text class="gl" x="58" y="24" text-anchor="middle">0</text>
          <text class="gl" x="320" y="188" text-anchor="middle">50</text>
        </svg>
        <div class="ic" id="logo"></div>
      </div>
      <div class="cond" id="cond">--</div>
      <div class="stats">
        <div><b id="s1">--</b><span>Feels like</span></div>
        <div><b id="s2">--</b><span>Wind</span></div>
        <div><b id="s3">--</b><span>Humidity</span></div>
        <div><b id="s4">--</b><span>Rain chance</span></div>
      </div>
      
      <p class="mute" id="hint">Scroll down to see what to wear.</p>
      <p class="mute" id="src"></p>
    </div>
    <div class="wear" id="wear">
      <h2>What to wear</h2>
      <div class="fbox" id="fitems"></div>
      <p class="ws" id="wsum"></p>
      <p class="wd mute" id="wdesc"></p>
    </div>
  </div></section>

  <section class="pg" id="p2" aria-label="Next 14 days"><div class="in">
    <h2>Next 14 days</h2>
    <p class="mute">Tap a day to see its details.</p>
    <div id="fc"></div>
  </div></section>
</div>

<nav class="tabs" aria-label="Pages">
  <button class="btn" type="button">Wind map</button><span class="ln"></span>
  <button class="btn" type="button">Now</button><span class="ln"></span>
  <button class="btn" type="button">14 days</button>
</nav>

      var row=document.createElement("div");row.className="day"+(i?"":" t");row.setAttribute("role","button");row.tabIndex=0;row.setAttribute("aria-expanded","false");
      var ic=document.createElement("div");ic.className="ic";ic.innerHTML=icon(r.c);
      var mid=document.createElement("div"),b=document.createElement("b"),s=document.createElement("small");
      b.textContent=i?r.date.toLocaleDateString("en-GB",{weekday:"long"}):"Today";
      s.textContent=r.date.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" · "+cd[0]+" · "+r.rain+"% rain";
      mid.appendChild(b);mid.appendChild(s);
      var rg=document.createElement("div");rg.className="rng";rg.textContent=r.hi+"° / "+r.lo+"°";
      var bar=document.createElement("div"),fi=document.createElement("i");bar.className="bar";
      fi.style.left=Math.max(0,(r.lo+30)/80*100)+"%";fi.style.width=Math.max(4,(r.hi-r.lo)/80*100)+"%";bar.appendChild(fi);rg.appendChild(bar);
      row.appendChild(ic);row.appendChild(mid);row.appendChild(rg);
      var det=document.createElement("div");det.className="det";det.hidden=true;
      var g=document.createElement("div");g.className="dg";
      [["High / low",r.hi+"° / "+r.lo+"°"],["Feels like",r.f+"°"],["Humidity",r.hum+"%"],["Rain chance",r.rain+"%"],["Rain amount",r.mm+" mm"],["UV index",String(r.uv)],["Wind 10 m",r.w+" km/h"],["Gusts",r.g+" km/h"],["Wind 80 m",r.w80+" km/h"],["Wind 120 m",r.w120+" km/h"],["Wind 180 m",r.w180+" km/h"],["Sunrise / sunset",r.sr+" / "+r.ss]].forEach(function(a){g.appendChild(cell(a[0],a[1]))});
      var p=document.createElement("p");p.textContent=wear(r.hi,r.c).d;
      det.appendChild(g);det.appendChild(p);
      function tog(){
        var open=row.getAttribute("aria-expanded")==="true";
        [].slice.call(fc.querySelectorAll(".day")).forEach(function(x){x.setAttribute("aria-expanded","false")});
        [].slice.call(fc.querySelectorAll(".det")).forEach(function(x){x.hidden=true});
        if(!open){row.setAttribute("aria-expanded","true");det.hidden=false;dw.scrollIntoView({block:"nearest",behavior:rm?"auto":"smooth"})}

      dw.appendChild(row);dw.appendChild(det);fc.appendChild(dw);
    });
  }
  window.repaint=function(){};

  /* Wind map: pixel land + flowing particles (live grid when available) */
  var W=240,H=120,lc=$("land").getContext("2d"),pc=$("wind").getContext("2d"),GRID=null,GN=18,GM=8;
  var P=[[-168,66,-160,71,-125,70,-95,72,-80,68,-62,60,-55,50,-66,44,-76,35,-81,31,-80,25,-90,29,-97,26,-97,19,-88,21,-83,10,-78,8,-86,13,-95,16,-105,20,-112,28,-117,32,-124,40,-125,48,-135,57,-150,60,-165,60],
  [-78,8,-62,10,-50,0,-35,-6,-39,-15,-48,-26,-58,-38,-65,-42,-68,-54,-74,-50,-73,-37,-71,-18,-81,-5,-80,0],
  [-73,78,-55,82,-20,82,-20,70,-43,60,-53,67],
  [-10,36,-9,43,-1,46,-5,48,4,52,9,55,8,58,14,56,20,60,26,66,30,70,45,68,70,73,100,77,140,72,170,70,180,66,160,58,142,52,140,46,130,42,127,38,122,40,121,31,108,21,105,10,100,13,103,2,98,8,92,22,80,15,77,8,72,20,66,25,57,24,59,21,52,16,43,13,35,28,33,31,36,36,28,36,26,40,23,38,22,36,12,38,8,44,3,43,-5,36],
  [-17,21,-10,30,-6,36,10,37,20,32,32,31,34,28,43,12,51,12,40,-3,40,-15,35,-25,20,-35,17,-30,12,-17,9,0,9,5,-8,4,-17,14],
  [114,-22,122,-18,130,-12,142,-11,146,-19,153,-27,150,-37,140,-38,131,-31,115,-34],
  [-180,-70,180,-70,180,-90,-180,-90],[-5,50,-3,58,2,53],[130,31,141,40,145,44,140,36]];
  window.drawLand=function(){
    var p=pal();lc.clearRect(0,0,W,H);lc.fillStyle=p.S;lc.strokeStyle=p.I;lc.lineWidth=1;
    P.forEach(function(a){lc.beginPath();for(var i=0;i<a.length;i+=2){var X=(a[i]+180)/1.5,Y=(90-a[i+1])/1.5;if(i)lc.lineTo(X,Y);else lc.moveTo(X,Y)}lc.closePath();lc.fill();lc.stroke()});
  };
  drawLand();
  function uv(x,y){
    var lon=x*1.5-180,lat=90-y*1.5;
    if(GRID){
      var fx=(lon+180)/20,fy=Math.max(0,Math.min(GM-1,(lat+60)/20)),i0=Math.floor(fx)%GN,i1=(i0+1)%GN,j0=Math.floor(fy),j1=Math.min(GM-1,j0+1),tx=fx-Math.floor(fx),ty=fy-j0;
      function g(i,j){return GRID[j*GN+i]}
      var a=g(i0,j0),b=g(i1,j0),c=g(i0,j1),d=g(i1,j1);
      return[0,1].map(function(k){return(a[k]*(1-tx)+b[k]*tx)*(1-ty)+(c[k]*(1-tx)+d[k]*tx)*ty});
    }
    var ph=lat*Math.PI/180;
    return[-8*Math.cos(3*ph)+3*Math.sin(lon*Math.PI/60+ph*4),4*Math.sin(lon*Math.PI/45+ph*2)*Math.cos(ph)];
  }
  function loadGrid(){
    var la=[],lo=[];for(var y=-60;y<=80;y+=20)for(var x=-180;x<=160;x+=20){la.push(y);lo.push(x)}
    fetch("https://api.open-meteo.com/v1/forecast?latitude="+la.join()+"&longitude="+lo.join()+"&current=wind_speed_10m,wind_direction_10m").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
      var arr=Array.isArray(j)?j:[j];if(arr.length!==la.length)throw 0;
      GRID=arr.map(function(o){var s=o.current.wind_speed_10m/3.6,d=o.current.wind_direction_10m*Math.PI/180;return[-s*Math.sin(d),-s*Math.cos(d)]});
      $("wnote").textContent="Live wind 10 m above ground from Open-Meteo, on a 20° grid. Tap the map to read the wind at that spot.";
    }).catch(function(){});
  }
  var N=520,px=[],py=[],pa=[];
  function spawn(i){px[i]=Math.random()*W;py[i]=Math.random()*H;pa[i]=40+Math.random()*120}
  for(var i=0;i<N;i++)spawn(i);
  function step(fade){
    if(fade){pc.globalCompositeOperation="destination-out";pc.fillStyle="rgba(0,0,0,.1)";pc.fillRect(0,0,W,H);pc.globalCompositeOperation="source-over"}
    pc.fillStyle=css("--ink");
    for(var i=0;i<N;i++){
      var w=uv(px[i],py[i]);px[i]+=w[0]*.06;py[i]-=w[1]*.06;
      if(px[i]<0)px[i]+=W;if(px[i]>=W)px[i]-=W;
      if(--pa[i]<0||py[i]<0||py[i]>=H)spawn(i);
      pc.fillRect(px[i]|0,py[i]|0,1,1);
    }
  }
  if(rm){for(var k=0;k<50;k++)step(false)}
  else{var n=0;(function loop(){if(++n&1)step(true);requestAnimationFrame(loop)})()}
  var cp=["N","NE","E","SE","S","SW","W","NW"];
  var mbx=$("mb"),mz=$("mz"),Z=1,TX=0,TY=0,drag=null;
  function applyZ(){
    var w=mbx.clientWidth,h=mbx.clientHeight;Z=Math.max(1,Math.min(8,Z));
    TX=Math.min(0,Math.max(w*(1-Z),TX));TY=Math.min(0,Math.max(h*(1-Z),TY));
    mz.style.setProperty("--z",Z);mz.style.setProperty("--tx",TX+"px");mz.style.setProperty("--ty",TY+"px");mbx.classList.toggle("zm",Z>1);
  }
  function zoomBy(k){var w=mbx.clientWidth,h=mbx.clientHeight,z2=Math.max(1,Math.min(8,Z*k)),r=z2/Z;TX=w/2-(w/2-TX)*r;TY=h/2-(h/2-TY)*r;Z=z2;applyZ()}
  $("zin").addEventListener("click",function(){zoomBy(1.6)});
  $("zout").addEventListener("click",function(){zoomBy(1/1.6)});
  window.addEventListener("resize",applyZ);
  function readWind(e){
    var r=mz.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;
    if(fx<0||fx>1||fy<0||fy>1)return;
    var w=uv(fx*W,fy*H),sp=Math.round(Math.hypot(w[0],w[1])*3.6),b=(Math.atan2(-w[0],-w[1])*180/Math.PI+360)%360;
    var q=$("qp");q.hidden=false;q.style.left=fx*100+"%";q.style.top=fy*100+"%";
    $("rd").textContent="Lat "+(90-fy*180).toFixed(1)+"°, lon "+(fx*360-180).toFixed(1)+"° · wind "+sp+" km/h from the "+cp[Math.round(b/45)%8];
  }
  mbx.addEventListener("pointerdown",function(e){if(e.target.closest(".zb"))return;drag={x:e.clientX,y:e.clientY,tx:TX,ty:TY,moved:false}});
  mbx.addEventListener("pointermove",function(e){
    if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.moved&&Z>1&&Math.hypot(dx,dy)>5){drag.moved=true;try{mbx.setPointerCapture(e.pointerId)}catch(x){}}
    if(drag.moved){TX=drag.tx+dx;TY=drag.ty+dy;applyZ()}
  });
  mbx.addEventListener("pointerup",function(e){var d=drag;drag=null;if(!d||d.moved)return;if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>5)return;readWind(e)});
  mbx.addEventListener("pointercancel",function(){drag=null});

  /* Pager and bottom buttons */
  var pg=$("pager"),pages=[].slice.call(document.querySelectorAll(".pg")),tabs=[].slice.call(document.querySelectorAll(".tabs button")),idx=1;
  function setIdx(i){idx=i;tabs.forEach(function(b,j){if(j===i)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")})}
  function sync(){var w=pg.clientWidth||1;setIdx(Math.max(0,Math.min(2,Math.round(pg.scrollLeft/w))))}
  function go(i){pg.scrollTo({left:i*pg.clientWidth,behavior:rm?"auto":"smooth"})}
  tabs.forEach(function(b,i){b.addEventListener("click",function(){go(i)})});
  pg.addEventListener("scroll",sync,{passive:true});
  pg.addEventListener("scrollend",sync);
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)setIdx(pages.indexOf(e.target))})},{root:pg,threshold:.6});
    pages.forEach(function(p){io.observe(p)});
  }
  function home(){pg.style.scrollSnapType="none";pg.scrollLeft=pg.clientWidth;pg.style.scrollSnapType="";sync()}
  home();requestAnimationFrame(home);window.addEventListener("load",home);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(home);
  window.addEventListener("resize",function(){pg.style.scrollSnapType="none";pg.scrollLeft=idx*pg.clientWidth;pg.style.scrollSnapType=""});
  document.addEventListener("keydown",function(e){if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")go(Math.min(2,idx+1));if(e.key==="ArrowLeft")go(Math.max(0,idx-1))});

  /* City search: Open-Meteo geocoding when live, built-in list otherwise */
  var q=$("q"),rs=$("rs"),cur=[],tmr;
  function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
  function local(){var v=norm(q.value.trim());return v?CITIES.filter(function(c){return norm(c[0]).indexOf(v)>-1}).map(function(c){return[c[0],c[1],c[2],c[3],c[0]]}):[]}
  function renderList(a){
    cur=a.slice(0,6);rs.textContent="";
    if(!cur.length){var d=document.createElement("div");d.className="nr";d.textContent=LIVE?"No city found.":"No match in the sample list yet.";rs.appendChild(d)}
    cur.forEach(function(c){var b=document.createElement("button");b.type="button";b.textContent=c[0];b.addEventListener("click",function(){pick(c)});rs.appendChild(b)});
    rs.hidden=false;
  }
  function pick(c){
    city=c[4]||c[0];clat=c[1];clon=c[2];off=c[3];
    var y=$("you");y.style.left=(clon+180)/3.6+"%";y.style.top=(90-clat)/1.8+"%";$("yl").textContent=city;
    q.value=city;rs.hidden=true;q.blur();loadCity();go(1);
  }
  q.addEventListener("input",function(){
    clearTimeout(tmr);var v=q.value.trim();if(!v){rs.hidden=true;return}
    if(!LIVE){renderList(local());return}
    tmr=setTimeout(function(){
      fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(v)+"&count=6&language=en&format=json").then(function(r){return r.json()}).then(function(j){
        renderList((j.results||[]).map(function(x){return[x.name+(x.admin1?", "+x.admin1:"")+(x.country?", "+x.country:""),x.latitude,x.longitude,0,x.name]}));
      }).catch(function(){renderList(local())});
    },250);
  });
  q.addEventListener("keydown",function(e){if(e.key==="Enter"&&cur.length&&!rs.hidden)pick(cur[0])});
  document.addEventListener("click",function(e){if(!e.target.closest(".search"))rs.hidden=true});

  /* Load data for the current city */
  function loadCity(){
    function done(src){show("now");buildFc();$("src").textContent=src}
    if(!LIVE){sampleData();done("Sample weather. Live data is not connected in this version.");return}
    $("where").textContent="Loading "+city+"…";
    fetchLive().then(function(){done("Live data from Open-Meteo, "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}))})
    .catch(function(){sampleData();done("Could not reach Open-Meteo. Showing sample weather.")});
  }
  loadCity();
  if(LIVE)loadGrid();
})();
