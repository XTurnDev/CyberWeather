<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Sky – Weather</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="search">
  <input id="q" type="search" placeholder="Search city" aria-label="Search city" autocomplete="off">
  <div class="rs" id="rs" hidden></div>
</div>
<button class="btn mode" id="mode" type="button" aria-pressed="false" aria-label="Switch to night mode"></button>

<div id="pager">
  <section class="pg" id="p0" aria-label="World wind map"><div class="in">
    <h2>World winds</h2>
    <p class="mute" id="wnote">An illustrated wind model, not live data. Tap the map to read the wind at that spot.</p>
    <div class="mapbox" id="mb">
      <div class="mz" id="mz">
        <canvas id="land" width="240" height="120"></canvas>
        <canvas id="wind" width="240" height="120"></canvas>
        <span class="pin" id="you" style="left:57.9%;top:29.3%"><b id="yl">Muğla</b></span>
        <span class="pin q" id="qp" hidden></span>
      </div>
      <div class="zb"><button class="btn zbtn" id="zin" type="button" aria-label="Zoom in">+</button><button class="btn zbtn" id="zout" type="button" aria-label="Zoom out">&minus;</button></div>
    </div>
    <div id="rd">Tap the map to see the wind.</div>
  </div></section>

  <section class="pg" id="p1" aria-label="Weather now"><div class="in">
    <div class="scr">
      <p class="mute" id="where"></p>
      <div class="temp" id="temp">--°C</div>
      <div class="gauge" id="fr" role="img" aria-label="Current weather">
        <svg class="arc" viewBox="0 -8 340 202" aria-hidden="true">
          <path class="disc" d="M25 165A145 145 0 0 1 315 165Z"/>
          <path class="trk" d="M20 165A150 150 0 0 1 320 165"/>
          <path class="fil" id="arcF" d="M20 165A150 150 0 0 1 320 165" pathLength="100" stroke-dasharray="0 100"/>
          <line x1="14" y1="165" x2="326" y2="165" stroke="currentColor" stroke-width="1.5"/>
          <g id="ticks"></g>
          <text class="gl" x="20" y="188" text-anchor="middle">-20</text>
          <text class="gl" x="58" y="24" text-anchor="middle">0</text>
          <text class="gl" x="320" y="188" text-anchor="middle">50</text>
        </svg>
        <div class="ic" id="logo"></div>
      </div>
      <div class="cond" id="cond">--</div>
      <div class="stats">
        <div><b id="s1">--</b><span>Feels like</span></div>
        <div><b id="s2">--</b><span>Wind</span></div>
        <div><b id="s3">--</b><span>Humidity</span></div>
        <div><b id="s4">--</b><span>Rain chance</span></div>
      </div>
      
      <p class="mute" id="hint">Scroll down to see what to wear.</p>
      <p class="mute" id="src"></p>
    </div>
    <div class="wear" id="wear">
      <h2>What to wear</h2>
      <div class="fbox" id="fitems"></div>
      <p class="ws" id="wsum"></p>
      <p class="wd mute" id="wdesc"></p>
    </div>
  </div></section>

  <section class="pg" id="p2" aria-label="Next 14 days"><div class="in">
    <h2>Next 14 days</h2>
    <p class="mute">Tap a day to see its details.</p>
    <div id="fc"></div>
  </div></section>
</div>

<nav class="tabs" aria-label="Pages">
  <button class="btn" type="button">Wind map</button><span class="ln"></span>
  <button class="btn" type="button">Now</button><span class="ln"></span>
  <button class="btn" type="button">14 days</button>
</nav>

<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
